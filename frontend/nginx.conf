server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Importación de .gpkg (25 MB) y confirmación con GeoJSON (10 MB).
  client_max_body_size 30m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    # 127.0.0.11 es el DNS interno de Docker. Con la variable se vuelve a
    # resolver "backend" aunque el contenedor se recree con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:3000;
    proxy_pass $api_backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La importación de relevamientos puede tardar.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # React Router usa BrowserRouter: las rutas del cliente vuelven a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
